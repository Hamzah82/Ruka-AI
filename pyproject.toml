[project]
name = "ruka-ai"
version = "1.0.0"
description = "Ruka AI — agent CLI kura-kura untuk file, folder, terminal, dan memori lintas-sesi."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hamzah82" }]
dependencies = [
    "requests>=2.28.0,<3",
    "python-dotenv>=1.0.0,<2",
]

[project.optional-dependencies]
ppt = ["python-pptx>=1.0.0,<2"]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["sessions", "data", "workspace", "__pycache__"]

[tool.ruff.lint]
# Tahap awal: hanya error fatal (nama tidak terdefinisi, import rusak, syntax).
# Perketat seleksi (E,F,W,I,UP,B) setelah refactor modul selesai.
select = ["E9", "F63", "F7", "F82"]
